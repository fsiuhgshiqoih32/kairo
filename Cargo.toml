[package]
name = "kairo"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Instant replay for Windows, macOS and Linux: press F8 to save the last 30 seconds of your screen and sound."
license = "MIT"
repository = "https://github.com/fsiuhgshiqoih32/kairo"
readme = "README.md"
keywords = ["replay", "clip", "screen-recording", "gaming", "medal"]
categories = ["multimedia::video"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
dirs = "6"
global-hotkey = "0.9"
iced = { version = "0.14", features = ["image", "svg", "canvas", "advanced", "tokio", "qr_code"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"
opener = { version = "0.9", features = ["reveal"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tiny-skia = "0.11"
ab_glyph = "0.2"
toml = "1"
tray-icon = "0.26"
auto-launch = "0.6"
ureq = { version = "3", features = ["json"] }
self-replace = "1.5"
sha2 = "0.11"
libloading = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Performance",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Security_Credentials",
] }


[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-core-media = "0.3"
objc2-core-audio-types = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
security-framework = "3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
dbus-secret-service = "4"

[build-dependencies]
winresource = "0.1"

# The Windows installer is its own small program (installer/); plain `cargo build` here builds
# only Kairo.
[workspace]
members = [".", "installer"]
default-members = ["."]

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
