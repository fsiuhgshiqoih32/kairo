name: Release

# Publishing a version: bump `version` in Cargo.toml, add a CHANGELOG.md section, push to main.
# Once CI passes on that commit, this workflow notices the new version, builds every platform
# with the bundled ffmpeg, checks each package runs, and publishes the GitHub release (creating
# the vX.Y.Z tag). Installed copies find it through "Check for updates".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The commit CI tested (or the branch tip when started by hand).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      ffmpeg: ${{ steps.v.outputs.ffmpeg }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          ffmpeg=$(tr -d '[:space:]' < packaging/ffmpeg/release.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ffmpeg=$ffmpeg" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif ! gh release view "$ffmpeg" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::The bundled ffmpeg ($ffmpeg) isn't published yet; run the ffmpeg workflow, then this one."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing v$version."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_TAG: ${{ needs.version.outputs.ffmpeg }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          rustflags: ""
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "rewindr-v$($env:VERSION)-windows-x64"
          gh release download $env:FFMPEG_TAG --pattern ffmpeg-windows-x64.zip --dir ff
          Expand-Archive ff/ffmpeg-windows-x64.zip -DestinationPath $name
          Copy-Item target/release/rewindr.exe, README.md, LICENSE $name
          Remove-Item Env:REWINDR_FFMPEG -ErrorAction SilentlyContinue
          $env:REWINDR_HOME = "$PWD/selftest-home"
          # A windowed program: PowerShell doesn't wait for it unless told to.
          $p = Start-Process -FilePath "$name/rewindr.exe" -ArgumentList "--self-test" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rewindr-*.zip

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_TAG: ${{ needs.version.outputs.ffmpeg }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          target: aarch64-apple-darwin, x86_64-apple-darwin
          rustflags: ""
      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package app bundle
        run: |
          set -euo pipefail
          app="Rewindr.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/rewindr" \
            target/aarch64-apple-darwin/release/rewindr target/x86_64-apple-darwin/release/rewindr
          gh release download "$FFMPEG_TAG" --pattern ffmpeg-macos.zip --dir ff
          unzip -o ff/ffmpeg-macos.zip -d ff
          cp ff/ffmpeg "$app/Contents/MacOS/ffmpeg"
          chmod +x "$app/Contents/MacOS/ffmpeg"
          cp ff/FFMPEG-LICENSE.txt ff/FFMPEG-SOURCE.txt LICENSE README.md "$app/Contents/Resources/"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          iconset=Rewindr.iconset
          mkdir "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d assets/icon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/Rewindr.icns"
          codesign --force --deep --sign - "$app"
          REWINDR_HOME="$PWD/selftest-home" "$app/Contents/MacOS/rewindr" --self-test
          ditto -c -k --keepParent "$app" "rewindr-v$VERSION-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rewindr-*.zip

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    # The oldest supported runner, so the program runs on older distributions too.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FFMPEG_TAG: ${{ needs.version.outputs.ffmpeg }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          rustflags: ""
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev \
            libxcb1-dev libxrandr-dev libdbus-1-dev libasound2-dev libwayland-dev \
            libegl1-mesa-dev libgbm-dev xvfb
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          set -euo pipefail
          name="rewindr-v$VERSION-linux-x86_64"
          mkdir "$name"
          gh release download "$FFMPEG_TAG" --pattern ffmpeg-linux-x86_64.zip --dir ff
          unzip -o ff/ffmpeg-linux-x86_64.zip -d "$name"
          chmod +x "$name/ffmpeg"
          cp target/release/rewindr README.md LICENSE packaging/linux/rewindr.desktop "$name/"
          cp assets/icon.png "$name/rewindr.png"
          REWINDR_HOME="$PWD/selftest-home" xvfb-run -a -s "-screen 0 1280x800x24" "$name/rewindr" --self-test
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rewindr-*.tar.gz

  publish:
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SHA }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          set -euo pipefail
          (cd dist && sha256sum rewindr-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="## $VERSION" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --target "$SHA" --latest \
            --title "Rewindr $VERSION" --notes-file notes.md
