name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ffmpeg: ffmpeg-windows-x64.zip
          - name: macOS
            os: macos-latest
            ffmpeg: ffmpeg-macos.zip
          - name: Linux
            os: ubuntu-24.04
            ffmpeg: ffmpeg-linux-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      REWINDR_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev \
            libxcb1-dev libxcb-shm0 libxcb-xfixes0 libxrandr-dev libdbus-1-dev libasound2-dev libwayland-dev \
            libegl1-mesa-dev libgbm-dev libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri xvfb

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      # The bundled ffmpeg is published by the ffmpeg workflow; until the first one exists,
      # the self-test is skipped.
      - name: Bundled ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < packaging/ffmpeg/release.txt)
          if gh release download "$tag" --pattern "${{ matrix.ffmpeg }}" --dir ffmpeg-bundle; then
            (cd ffmpeg-bundle && unzip -o "${{ matrix.ffmpeg }}")
            exe=ffmpeg; [ "$RUNNER_OS" = Windows ] && exe=ffmpeg.exe
            chmod +x "ffmpeg-bundle/$exe" || true
            echo "REWINDR_FFMPEG=$PWD/ffmpeg-bundle/$exe" >> "$GITHUB_ENV"
          else
            echo "::warning::No bundled ffmpeg release $tag yet; skipping the self-test."
          fi

      - name: Self-test
        if: env.REWINDR_FFMPEG != '' && runner.os != 'Linux'
        run: cargo run --locked -- --self-test

      - name: Self-test (Xvfb)
        if: env.REWINDR_FFMPEG != '' && runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo run --locked -- --self-test
