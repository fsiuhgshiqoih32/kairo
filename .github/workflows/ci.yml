name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ffmpeg: ffmpeg-windows-x64.zip
          - name: macOS
            os: macos-latest
            ffmpeg: ffmpeg-macos.zip
          - name: Linux
            os: ubuntu-24.04
            ffmpeg: ffmpeg-linux-x86_64.zip
    runs-on: ${{ matrix.os }}
    env:
      KAIRO_HOME: ${{ github.workspace }}/.ci-home
    steps:
      - uses: actions/checkout@v5

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.97.0"
          components: clippy, rustfmt
          rustflags: ""

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev libxkbcommon-dev \
            libxcb1-dev libxcb-shm0 libxcb-xfixes0 libxrandr-dev libdbus-1-dev libasound2-dev libwayland-dev \
            libegl1-mesa-dev libgbm-dev libxkbcommon-x11-0 mesa-vulkan-drivers libgl1-mesa-dri xvfb flite

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo clippy --locked --all-targets -p kairo-setup -- -D warnings
          cargo test --locked -p kairo-setup

      # The bundled ffmpeg is published by the ffmpeg workflow; until the first one exists,
      # the self-test is skipped.
      - name: Bundled ffmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(tr -d '[:space:]' < packaging/ffmpeg/release.txt)
          if gh release download "$tag" --pattern "${{ matrix.ffmpeg }}" --dir ffmpeg-bundle; then
            (cd ffmpeg-bundle && unzip -o "${{ matrix.ffmpeg }}")
            exe=ffmpeg; dir=$PWD
            # Git Bash's $PWD is /d/a/...; the Windows program needs D:/a/...
            if [ "$RUNNER_OS" = Windows ]; then exe=ffmpeg.exe; dir=$(pwd -W); fi
            chmod +x "ffmpeg-bundle/$exe" || true
            echo "KAIRO_FFMPEG=$dir/ffmpeg-bundle/$exe" >> "$GITHUB_ENV"
          else
            echo "::warning::No bundled ffmpeg release $tag yet; skipping the self-test."
          fi

      - name: Self-test
        if: env.KAIRO_FFMPEG != '' && runner.os != 'Linux'
        run: cargo run --locked -- --self-test

      - name: Window self-test
        if: env.KAIRO_FFMPEG != '' && runner.os != 'Linux'
        run: cargo run --locked -- --ui-self-test

      - name: Self-test (Xvfb)
        if: env.KAIRO_FFMPEG != '' && runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo run --locked -- --self-test

      - name: Window self-test (Xvfb)
        if: env.KAIRO_FFMPEG != '' && runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" cargo run --locked -- --ui-self-test

      # Voice clipping: the system's speech synthesiser says the phrase (and a few other
      # things) into files; the recognizer (downloaded on first use) must hear only the phrase.
      - name: Voice test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $say = @{ "said1" = "clip that"; "said2" = "that was insane, clip that"; "other1" = "we need to push now"; "other2" = "grab the flag" }
          foreach ($k in $say.Keys) { $s.SetOutputToWaveFile("$PWD\$k.wav", $fmt); $s.Speak($say[$k]) }
          $s.SetOutputToNull()
          cargo run --locked -- voice-test "clip that" '+said1.wav' '+said2.wav' '-other1.wav' '-other2.wav'
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Voice test (macOS)
        if: runner.os == 'macOS'
        run: |
          for p in "said1:clip that" "said2:that was insane, clip that" "other1:we need to push now" "other2:grab the flag"; do
            say -o "${p%%:*}.wav" --file-format=WAVE --data-format=LEI16@16000 "${p#*:}"
          done
          cargo run --locked -- voice-test "clip that" +said1.wav +said2.wav -other1.wav -other2.wav

      - name: Voice test (Linux)
        if: runner.os == 'Linux'
        run: |
          for p in "said1:clip that" "said2:that was insane, clip that" "other1:we need to push now" "other2:grab the flag"; do
            flite -voice slt -t "${p#*:}" -o "${p%%:*}.wav"
          done
          cargo run --locked -- voice-test "clip that" +said1.wav +said2.wav -other1.wav -other2.wav
