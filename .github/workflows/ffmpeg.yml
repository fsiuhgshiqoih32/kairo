name: ffmpeg

# Builds the small ffmpeg that ships inside Rewindr's packages (see packaging/ffmpeg/build.sh)
# and publishes it as the prerelease named in packaging/ffmpeg/release.txt. The CI and Release
# workflows download it from there, so it's built once, not on every release. To rebuild,
# change the script and bump the name in release.txt.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - packaging/ffmpeg/**
      - .github/workflows/ffmpeg.yml

permissions:
  contents: write

concurrency:
  group: ffmpeg
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make nasm diffutils zip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-amf-headers
      - name: Build
        run: bash packaging/ffmpeg/build.sh out
      - name: Check
        run: |
          set -e
          out/ffmpeg.exe -hide_banner -f lavfi -i testsrc2=size=320x240:rate=30 -frames:v 30 -c:v libx264 -f mpegts out/check.ts
          out/ffmpeg.exe -hide_banner -filters | grep -E "gfxcapture|ddagrab"
          out/ffmpeg.exe -hide_banner -encoders | grep -E "h264_nvenc|h264_amf|h264_mf"
          out/ffmpeg.exe -hide_banner -devices | grep gdigrab
          echo "DLLs it needs:"; ldd out/ffmpeg.exe
          if ldd out/ffmpeg.exe | grep -vi "/c/windows" | grep -q "=>"; then echo "depends on non-system DLLs"; exit 1; fi
          rm out/check.ts
      - name: Package
        run: cd out && zip -9 ../ffmpeg-windows-x64.zip ffmpeg.exe FFMPEG-LICENSE.txt FFMPEG-SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-windows
          path: ffmpeg-windows-x64.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install nasm
      - name: Build (Apple silicon)
        env:
          ARCH: arm64
          WORK: ${{ github.workspace }}/ffbuild-arm64
        run: bash packaging/ffmpeg/build.sh out-arm64
      - name: Build (Intel)
        env:
          ARCH: x86_64
          WORK: ${{ github.workspace }}/ffbuild-x86_64
        run: bash packaging/ffmpeg/build.sh out-x86_64
      - name: Universal binary and check
        run: |
          set -euo pipefail
          mkdir out
          lipo -create -output out/ffmpeg out-arm64/ffmpeg out-x86_64/ffmpeg
          cp out-arm64/FFMPEG-LICENSE.txt out-arm64/FFMPEG-SOURCE.txt out/
          lipo -info out/ffmpeg
          out/ffmpeg -hide_banner -f lavfi -i testsrc2=size=320x240:rate=30 -frames:v 30 -c:v libx264 -f mpegts /tmp/check.ts
          out/ffmpeg -hide_banner -encoders | grep h264_videotoolbox
          out/ffmpeg -hide_banner -devices | grep avfoundation
          echo "Libraries it needs:"; otool -L out/ffmpeg
          if otool -L out/ffmpeg | tail -n +2 | grep -v -E "^\s+(/System/|/usr/lib/)"; then echo "depends on non-system libraries"; exit 1; fi
      - name: Package
        run: cd out && zip -9 ../ffmpeg-macos.zip ffmpeg FFMPEG-LICENSE.txt FFMPEG-SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-macos
          path: ffmpeg-macos.zip

  linux:
    # The oldest supported runner, so the binary runs on older distributions too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm pkg-config libxcb1-dev libxcb-shm0-dev libxcb-xfixes0-dev zip
      - name: Build
        run: bash packaging/ffmpeg/build.sh out
      - name: Check
        run: |
          set -euo pipefail
          out/ffmpeg -hide_banner -f lavfi -i testsrc2=size=320x240:rate=30 -frames:v 30 -c:v libx264 -f mpegts /tmp/check.ts
          out/ffmpeg -hide_banner -encoders | grep h264_nvenc
          out/ffmpeg -hide_banner -devices | grep x11grab
          echo "Libraries it needs:"; ldd out/ffmpeg
      - name: Package
        run: cd out && zip -9 ../ffmpeg-linux-x86_64.zip ffmpeg FFMPEG-LICENSE.txt FFMPEG-SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-linux
          path: ffmpeg-linux-x86_64.zip

  publish:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(tr -d '[:space:]' < packaging/ffmpeg/release.txt)
          (cd dist && sha256sum ffmpeg-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" \
              --title "Bundled ffmpeg ($tag)" \
              --notes "The ffmpeg builds packaged with Rewindr (FFmpeg with x264, GPL). Built by packaging/ffmpeg/build.sh. These are not Rewindr releases."
          fi
